SESOI: |
  Smallest Effect Size of Interest: el efecto más pequeño que es teórica o prácticamente significativo (Cohen, 1988).


"mensaje digital": |
  Toda pieza comunicativa que circule por entornos digitales en cualquier modo comunicativo (visual, verbal, sonoro, etc.) o combinación de ellos. Esta definición sintetiza la noción de "ensamblaje multimodal" de Kress y Van Leeuwen (2001) y la "Ciberpragmática" de Francisco Yus (2011).

vlog: |
  Género discursivo específico y mensaje digital multimodal propio de las comunidades juveniles en YouTube. Siguiendo a Bajtín (1982), se define como un tipo relativamente estable de enunciado caracterizado por la puesta en escena de la subjetividad y una "autenticidad construida".

extimidad: |
  Categoría propuesta por Paula Sibilia (2008) para describir la exhibición de la intimidad propia de las subjetividades contemporáneas en la red y los nuevos medios impulsada por la cultura digital.

ciberdiscurso juvenil: |
  Concepto de María Gabriela Palazzo (2010), refiere a las prácticas discursivas juveniles en entornos digitales caracterizadas por la multimodalidad, la interactividad y la construcción performativa de identidades.

espacio social practicado: |
  A partir de De Certeau (1984, 1988), Joan Mayans i Planells (2002) traslada esta noción a Internet para definirla no como un canal de transmisión con o sin materialidad física, sino como un territorio simbólico construido a partir de la agencia cultural y sociabilidad significativa de sus usuarios.

competencia cibercomunicativa: |
  Readecuación teórica del concepto clásico de "competencia comunicativa" de Dell Hymes (1972) orientada a la capacidad pragmática situada de los jóvenes de gestionar la interacción en plataformas (leer los algoritmos, modular expresividad multimodal, gestionar la intimidad o los vínculos parasociales).

autenticidad performativa: |
  Paradójica característica fundamental de la construcción de identidades digitales en contextos como YouTube, en los que la exposición personal se basa en el montaje consciente de un "yo" proyectado para la audiencia disipando sus propios rastros mediante la actuación de autenticidad.

netnografía: |
  Adaptación de la etnografía al estudio de comunidades en entornos digitales propuesto por Robert Kozinets (2010), reconociendo las formas específicas que asumen las prácticas culturales al estar mediadas de modo multimodal, distribuido y registradas por plataformas masivas.

teoría fundada: |
  Horizonte epistemológico de Glaser y Strauss (1967) que postula la generación inductiva de categorías analíticas a partir del contacto sistemático con los datos empíricos.

análisis crítico del discurso (ACD): |
  Marco teórico-analítico empleado en la investigación, fundamentado en la propuesta de Norman Fairclough (1992, 2003, 2008), que conceptualiza al discurso como práctica social implicada en dinámicas y relaciones de poder, identidades y construcciones sociales del entorno global.

nivelación dialectal: |
  Proceso sociolingüístico por el cual hablantes de diferentes dialectos reducen sus rasgos distintivos para favorecer la inteligibilidad mutua, motivado por valoraciones de prestigio, alcance transnacional o integración, como se observa en youtubers argentinos que migran hacia una norma rioplatense (Trudgill y Hernández Campoy, 2007).

glocalidad lingüística: |
  Estrategia discursiva en espacios digitales caracterizada por la síntesis entre una estandarización formal (para un alcance global) y una marcación identitaria o temática situada (para la legitimidad local).

registro pragmático-discursivo (en vlogs): |
  Configuración específica del uso de la lengua motivada por la situación comunicativa, caracterizada por la asimetría parasocial, la funcionalidad algorítmica y el uso estratégico de la cortesía juvenil o anticortesía.

modulación pasional: |
  Estrategia semiótica que describe cómo el discurso construye, gestiona y comunica estados afectivos (Greimas y Fontanille, 1994). En el videoblog, la "coloración" emocional de la locución es fundamental para el establecimiento de vínculos de intimidad.

identidades narrativas (digitales): |
  Construcciones reflexivas donde los youtubers articulan selectivamente elementos de su biografía, mediaciones tecnológicas y expectativas de la audiencia. No son identidades "fijas", sino negociaciones performadas adaptables a las affordances de la plataforma.

triangulación metodológica: |
  Estrategia de investigación (Capítulo 3) que combina dimensiones cualitativas y cuantitativas (netnografía, teoría fundada y ACD) para observar un mismo fenómeno discursivo digital desde múltiples perspectivas, asegurando el rigor analítico.

Índice de Autenticidad Performativa (IAP): |
  Métrica desarrollada en esta tesis (Capítulo 5) para cuantificar la intensidad con la que un youtuber proyecta discursivamente su "yo genuino" independientemente del nivel de producción material audiovisual.

Índice de Cercanía Parasocial (ICP): |
  Métrica (Capítulo 5) operativa que evalúa la ilusión de intimidad o amistad no recíproca fomentada por los youtubers a través del uso de deícticos, interpelaciones directas a cámara y funciones apelativas del lenguaje.

Índice de Modulación Pasional (IMP): |
  Indicador que cuantifica las inflexiones expresivas, los quiebres de voz y la teatralización emocional extrema en el discurso, fundamentales para interpelar a las audiencias juveniles.

Índice de Extimidad (IEX): |
  Medición cuantitativa del grado en el que la esfera íntima y el backstage (conflictos familiares, miedos, espacios habitacionales privados) se despliegan públicamente como estrategia de consumo mediático.

Índice de Glocalidad (IGL): |
  Medición de la tensión entre referencias lingüísticas y culturales orientadas a lo transnacional/estándar frente a indicadores fuertemente situados o identitarios locales (por ejemplo, vocabulario puramente argentino).

trayectoria situacional: |
  Evolución en la producción de los creadores a lo largo del tiempo (Capítulo 6), que da cuenta del desplazamiento desde esquemas discursivos caseros hacia una progresiva profesionalización mercantil que reconfigura su pacto comunicativo inicial.
affordances: |
  Concepto acuñado por el psicólogo James J. Gibson (1979) y retomado en el contexto de los estudios de comunicación digital para describir las posibilidades de acción que una plataforma tecnológica habilita o condiciona en sus usuaries. En YouTube, las affordances incluyen la duración del video, el sistema de comentarios, la barra de progreso o los botones de "me gusta" y "suscribir", que moldean qué tipos de discurso son posibles, esperados o recompensados algorítmicamente.

algoritmo (de plataforma): |
  Sistema automatizado de clasificación y distribución de contenidos que determina qué videos son recomendados, bajo qué condiciones y a qué públicos. En YouTube, el algoritmo premia métricas como el tiempo de visualización (watch time), el engagement (likes, comentarios, compartidos) y la tasa de clics en la miniatura (CTR). Su opacidad y mutabilidad son factores estructurales que condicionan las trayectorias discursivas de los creadores analizados en esta tesis.

vínculo parasocial: |
  Tipo de relación unilateral e ilusoria de cercanía o amistad que los espectadores desarrollan con figuras mediáticas —en este caso, youtubers— sin posibilidad de reciprocidad real. Conceptualizado originalmente por Horton y Wohl (1956) para el análisis de figuras televisivas, en el contexto del videoblog se amplifica mediante estrategias discursivas como la dirección directa a cámara, el tuteo, los deícticos de inclusión ("nosotros", "ustedes") y la revelación de información personal (extimidad).

comunidades de práctica: |
  Concepto desarrollado por Jean Lave y Etienne Wenger (1991), retomado en sociolingüística por Penelope Eckert (2000), que describe grupos de personas que comparten un compromiso mutuo en torno a una actividad común, desarrollando recursos lingüísticos, simbólicos e identitarios propios. En el contexto de YouTube, los canales y sus audiencias constituyen comunidades de práctica en las que el vlog funciona como práctica social central.

género discursivo: |
  Siguiendo la teorización de Mijail Bajtín (1982), un "tipo relativamente estable de enunciado" anclado en una esfera de la actividad humana, caracterizado por su contenido temático, su estructura compositiva y su estilo lingüístico. El vlog es el género discursivo central de esta tesis: un género emergente que hereda convenciones de la autobiografía, el diario íntimo y el talk show, reconfiguradas por las affordances digitales.

superestructura textual: |
  Nivel de organización global de un texto que determina su esquema formal o estructural con independencia de su contenido semántico, según la propuesta de Teun van Dijk (1980). En el videoblog, la superestructura incluye la apertura ritual (saludo y presentación), el cuerpo temático, los llamados a la acción y el cierre. Su regularidad constituye uno de los argumentos empíricos centrales del Capítulo 4.

contrato de lectura: |
  Concepto de Eliseo Verón (1985) que describe el pacto tácito entre un medio o soporte textual y su público, establecido mediante las modalidades de enunciación (¿cómo te habla el texto?) y no solo por los contenidos (¿qué dice?). En YouTube, el contrato de lectura se materializa en la voz del youtuber, la mise en scène del canal y la frecuencia de publicación, creando expectativas de acceso, intimidad y regularidad que, de transgredirse, activan rituales de disculpa.

multimodalidad: |
  Perspectiva semiótica desarrollada por Gunther Kress y Theo van Leeuwen (1996, 2001) que sostiene que la comunicación humana nunca es exclusivamente verbal, sino que articula simultáneamente múltiples sistemas de signos o "modos": imagen, gesto, voz, música, disposición espacial, etc. En el videoblog, la multimodalidad es constitutiva: la identidad juvenil del youtuber se construye tanto por lo que dice como por cómo se mueve, qué ropa usa, cómo edita o qué música elige.

acomodación dialectal: |
  Proceso sociolingüístico descrito por Howard Giles en la "Teoría de la Acomodación Comunicativa" (CAT), por el cual los hablantes ajustan su producción lingüística —rasgos fonológicos, léxicos o pragmáticos— para acercarse (convergencia) o distanciarse (divergencia) del habla de su interlocutor. En los youtubers argentinos de origen no rioplatense (casos Ferro y Serrano), se observa una convergencia progresiva hacia rasgos del español rioplatense asociados al prestigio mediático.

backstage / frontstage: |
  Categorías del sociólogo Erving Goffman (1959), quien concibe la interacción social como una actuación teatral. El frontstage es el espacio de la actuación pública y controlada; el backstage, el de los ensayos, los descuidos y la "verdadera" identidad. En el videoblog, la exhibición estratégica del backstage —la habitación desordenada, el fracaso, el conflicto familiar— es el principal mecanismo de producción de autenticidad (extimidad).

engagement: |
  Término inglés (sin equivalente preciso en español) que designa el conjunto de acciones activas de un usuario ante un contenido: me gustas, comentarios, compartidos, tiempo de visualización completa, guardados en listas de reproducción. En YouTube, el engagement es la moneda de la visibilidad algorítmica: el sistema de recomendación prioriza los videos con mayor tasa de interacción. Es el indicador más citado por los propios youtubers del corpus al evaluar el éxito de sus publicaciones.

thumbnail: |
  Miniatura o imagen fija que representa visualmente un video de YouTube en las grillas de recomendación. Su diseño —expresiones faciales exageradas, tipografía llamativa, paleta cromática saturada— constituye el primer acto de comunicación del canal y es uno de los factores determinantes de la tasa de clics (CTR). En el corpus analizado, la evolución del thumbnail es un indicador visual de la trayectoria de profesionalización de los creadores.

clickbait: |
  Estrategia discursiva de diseño de títulos y miniaturas (thumbnails) orientada a maximizar los clics mediante la generación de expectativa, curiosidad o alarma, frecuentemente desproporcionada respecto del contenido real del video. Si bien la literatura lo trata como un fenómeno negativo (engaño), en el corpus es parte de un continuo de intensificación retórica propio del registro pragmático-discursivo del vlog.

hashtag: |
  Etiqueta precedida por el signo "#" usada en plataformas digitales para categorizar contenidos temáticamente y hacerlos recuperables dentro de conversaciones o tendencias (trending topics). En el videoblog de YouTube, su uso es menor que en Twitter o Instagram, pero su aparición en los títulos y descripciones de los videos marca una estrategia de posicionamiento transmedial.

challenge (reto viral): |
  Formato de vídeo participativo en el que el creador realiza una actividad —generalmente física, humorística o emotiva— y convoca explícitamente a sus seguidores a replicarla. Los challenges son un mecanismo de circulación viral y de construcción de comunidad. En el corpus, aparecen como eventos de alta extimidad (Ice Bucket Challenge, Condom Challenge) que suspenden temporalmente el formato conversacional del vlog para adoptar un formato de performance colectiva.

Call to Action (CTA): |
  Llamado a la acción: instrucción explícita e imperativa dirigida a la audiencia a realizar una acción concreta —suscribirse, dar like, comentar, compartir, activar la campanita—. Es el componente ritual obligatorio de cierre del vlog y una de las marcas discursivas más estables del corpus, independientemente del estilo del youtuber. Su análisis revela cómo el vínculo parasocial se instrumentaliza para la gestión del algoritmo.

variedad lingüística: |
  En sociolingüística, configuración relativamente estable de rasgos fonológicos, morfosintácticos, léxicos y pragmáticos asociada a una comunidad de hablantes, una región geográfica, un grupo social o un registro comunicativo. El Capítulo 7 argumenta que el español de YouTube no constituye una variedad lingüística autónoma (en el sentido técnico), sino un registro funcional superpuesto a las variedades de origen de cada creador.

influencer: |
  Figura mediática digital caracterizada por su capacidad de afectar las decisiones de consumo, creencias o comportamientos de una audiencia significativa a través de la producción de contenido en plataformas digitales. A diferencia del "youtuber" como categoría identitaria de este corpus, el influencer es esencialmente una categoría económica: implica la monetización de la credibilidad (autenticidad performativa) mediante publicidad integrada. Los creadores del corpus transitan la tensión entre ambas posiciones.

netspeak: |
  Término acuñado por David Crystal (2001) para describir las características lingüísticas del lenguaje usado en entornos digitales —asincrónico o sincrónico— incluyendo rasgos como abreviaciones gráficas, emoticones, restitución de oralidad en la escritura y creatividad léxica. Retomado por Cerruti y Onesti (2013) para argumentar que no constituye una "variedad" lingüística sino un registro funcional.

proyecto reflexivo del yo: |
  Concepto de Anthony Giddens (1991) que describe la identidad moderna como una narrativa continua que el individuo construye, revisa y mantiene a lo largo de su trayectoria vital, incorporando las transformaciones y los eventos del entorno social. En el contexto digital, el vlog materializa este proyecto reflexivo: cada publicación es un momento de autonarración pública que contribuye a la construcción de la identidad del youtuber.

imagen pública (face): |
  Adaptación del concepto goffmaniano de face, desarrollado por Penelope Brown y Stephen Levinson (1987) en el marco de la teoría de la cortesía: la imagen positiva (deseo de aprobación y pertenencia) y la imagen negativa (deseo de autonomía y no intrusión). En el vlog, las estrategias de cortesía y anticortesía son mecanismos de gestión de la imagen pública propia y de la audiencia.

anticortesía: |
  Fenómeno pragmático-discursivo descrito por Fernando Patiño Díaz y otros investigadores para grupos juveniles, en el que el insulto, la burla o la agresión verbal aparente operan como marcadores de solidaridad e intimidad grupal —opuestos a su función habitual de amenaza a la imagen pública. En el corpus, la anticortesía se observa en el tratamiento de la audiencia en youtubers de estilo humorístico, como un recurso de construcción de comunidad.


# Términos técnicos de Análisis de Redes Sociales (Capítulo 6)

PageRank: |
  Algoritmo desarrollado por Larry Page y Sergey Brin (Brin y Page, 1998) que mide la importancia de un nodo en una red considerando no solo cuántas conexiones tiene, sino la importancia de los nodos que lo conectan (Wasserman y Faust, 1994). Un youtuber con alto PageRank no es necesariamente el más conectado, sino el más conectado a actores significativos: sus vínculos tienen mayor "peso simbólico" dentro del campo.

Betweenness (centralidad de intermediación): |
  Métrica de análisis de redes (Wasserman y Faust, 1994) que mide la frecuencia con la que un nodo aparece en el camino más corto entre otros dos nodos de la red. Un actor con alta Betweenness controla el flujo de información entre grupos: es el "puente" indispensable para que dos partes del sistema se comuniquen. En el corpus, Julián Serrano concentra el mayor valor de Betweenness, lo que lo convierte en el principal intermediario del ecosistema vlogger argentino.

Hub Score (puntuación de concentrador): |
  Métrica desarrollada por Kleinberg (1999) que evalúa en qué medida un nodo funciona como distribuidor de conexiones hacia otros nodos importantes. Un "hub" es un conector: no acumula prestigio sino que lo redistribuye. A diferencia del PageRank (que evalúa el prestigio recibido), el Hub Score evalúa la capacidad de dar visibilidad a otros actores de la red.

densidad de red: |
  Proporción de conexiones existentes respecto del total de conexiones posibles entre los nodos de una red (Wasserman y Faust, 1994). Una red con densidad 1.0 sería aquella en la que todos los nodos están conectados entre sí; una con densidad cercana a 0, aquella en la que casi nadie se conecta con nadie. En el corpus (densidad 0.174), la baja densidad indica que el ecosistema vlogger argentino está fragmentado en grupos que colaboran poco entre sí.

modularidad de red: |
  Medida que cuantifica el grado en que una red se organiza en subgrupos o "comunidades" internas más densamente conectadas entre sí que con el resto de la red (Wasserman y Faust, 1994). Valores altos de modularidad (cercanos a 1) indican una red con fronteras comunitarias marcadas; valores bajos, una red sin agrupamientos claros. El corpus presenta una modularidad alta (0.493), coherente con la organización del ecosistema en cuatro "tribus" con lógicas propias.

coeficiente de clustering (coeficiente de agrupamiento): |
  Medida que indica la probabilidad de que los vecinos de un nodo también estén conectados entre sí (Wasserman y Faust, 1994): dicho llanamente, mide cuánto "se conocen entre sí los amigos de mis amigos". Un coeficiente alto indica que las relaciones tienden a formar triángulos cerrados (grupos cohesivos). En el corpus (0.377), refleja la tendencia a colaborar principalmente dentro de los propios círculos de afinidad.

algoritmo de Louvain: |
  Método computacional de detección de comunidades en redes, desarrollado por Blondel et al. (2008), que identifica agrupamientos de nodos maximizando la modularidad de la red. En el corpus, su aplicación en Gephi permitió identificar las cuatro "tribus" del ecosistema vlogger argentino según sus patrones de colaboración.

correlación (coeficiente de Pearson, r): |
  Medida estadística que indica el grado y la dirección de la relación lineal entre dos variables numéricas (Cohen, 1988). Sus valores oscilan entre -1 y +1: r = 1 implica relación positiva perfecta (cuando una variable sube, la otra también); r = -1, relación negativa perfecta; r = 0, ausencia de relación lineal. En el corpus, la correlación entre extimidad y cercanía parasocial (r = 0.726) indica una relación positiva fuerte: a mayor apertura de la intimidad, mayor intensidad del vínculo percibido por la audiencia.

valor p (p < 0.001): |
  Probabilidad de obtener un resultado igual o más extremo que el observado, asumiendo que no existe relación entre las variables —hipótesis nula— (Cohen, 1988). Un valor p < 0.001 significa que existe menos de un 0.1% de probabilidad de que el resultado sea producto del azar: es la forma académica convencional de decir que la relación encontrada es estadísticamente muy poco probable que sea accidental. No equivale a "importancia" o "tamaño del efecto", pero confirma que el patrón observado es robusto.

modelado de temas (LDA - Latent Dirichlet Allocation): |
  Técnica de aprendizaje automático no supervisado que identifica los "tópicos" latentes en un corpus textual asignando a cada documento una mezcla de tópicos y a cada tópico una distribución de palabras (Blei, Ng y Jordan, 2003). Su adopción en humanidades digitales para la exploración de grandes corpus discursivos fue impulsada por Graham, Milligan y Weingart (2015), entre otros, como herramienta de "lectura distante" complementaria al análisis cualitativo. En la tesis se aplicó sobre las transcripciones de los 80 videos —previa limpieza con lista de stopwords adaptadas al español coloquial rioplatense— para identificar los patrones temáticos dominantes de forma computacional. Los resultados operaron como andamio heurístico para la construcción del codebook, no como categorías analíticas definitivas. Véase Anexo G.

Voyant Tools: |
  Plataforma en línea de análisis textual de acceso abierto (Sinclair y Rockwell, 2016) diseñada para la exploración interactiva de corpus. Permite visualizar frecuencias de palabras, distribuciones en el corpus, concordancias (contextos de uso) y tendencias diacrónicas sin requerir programación. En la tesis se utilizó con fines exclusivamente exploratorios para orientar la construcción de la lista de stopwords y la selección de términos relevantes previo al modelado de tópicos. Para una evaluación crítica de la herramienta en el contexto de las humanidades digitales latinoamericanas, véase De Piero (2019).

montaje (identitario): |
  En el contexto de esta tesis, operación semiótica de articulación de elementos heterogéneos —cuerpo, voz, espacio, música, edición— que produce una configuración identitaria dotada de sentido propio, irreducible a cada elemento por separado (Kress y Van Leeuwen, 2001; Deleuze y Guattari, 1987). El youtuber no "muestra" una identidad preexistente sino que la construye —la "monta"— en el acto mismo de producir el video.

agencement (ensamblaje): |
  Término acuñado por Gilles Deleuze y Félix Guattari (Mille plateaux, 1980) para designar una configuración de elementos heterogéneos —cuerpos, herramientas, enunciados, deseos— que produce efectos de conjunto sin ser reductible a ninguno de sus componentes. En esta tesis, el concepto se retoma para comprender la identidad del youtuber como ensamblaje: no hay un "yo" previo que se expresa, sino un "yo" que emerge de la articulación específica de recursos semióticos en cada video.

